# ═══════════════════════════════════════════════════════════════════════════
# 电网地理信息系统 - Spring Boot 配置文件
# ═══════════════════════════════════════════════════════════════════════════
#
# 配置文件说明：
# - application.properties: 主配置文件，所有环境共享
# - application-dev.properties: 开发环境配置（可选）
# - application-prod.properties: 生产环境配置（可选）
#
# 配置优先级（从高到低）：
# 1. 命令行参数: java -jar app.jar --server.port=9000
# 2. 环境变量: SERVER_PORT=9000
# 3. application-{profile}.properties
# 4. application.properties
#
# ═══════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# 一、应用配置
# ─────────────────────────────────────────────────────────────────────────────
# 应用名称，用于日志、监控、服务注册等场景
spring.application.name=electric-grid-system

# ─────────────────────────────────────────────────────────────────────────────
# 二、服务器配置
# ─────────────────────────────────────────────────────────────────────────────
# HTTP 服务端口
# - 80: 标准HTTP端口（需要管理员权限）
# - 8080: 常用开发端口
# - 8443: HTTPS开发端口
server.port=8080

# ─────────────────────────────────────────────────────────────────────────────
# 三、数据库配置
# ─────────────────────────────────────────────────────────────────────────────
# H2 数据库连接配置
#
# JDBC URL 格式说明：
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ jdbc:h2:mem:electricdb                                                  │
# │ - 内存模式：数据存储在内存中，重启后数据丢失                               │
# │ - 适合：单元测试、临时数据                                                │
# │                                                                          │
# │ jdbc:h2:file:./data/electricdb                                          │
# │ - 文件模式：数据存储在磁盘文件中，重启后数据保留                            │
# │ - 适合：开发环境、小规模应用                                              │
# │                                                                          │
# │ 参数说明：                                                               │
# │ - DB_CLOSE_ON_EXIT=FALSE: JVM退出时不关闭数据库                          │
# │ - AUTO_RECONNECT=TRUE: 自动重连                                          │
# │ - DB_CLOSE_DELAY=-1: 数据库保持打开直到手动关闭                           │
# └─────────────────────────────────────────────────────────────────────────┘
spring.datasource.url=jdbc:h2:file:./data/electricdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE

# 数据库驱动类名
# H2 是一个嵌入式 Java 数据库，无需安装，适合开发和测试
spring.datasource.driver-class-name=org.h2.Driver

# 数据库用户名和密码
# H2 默认用户名是 "sa" (System Administrator)，密码为空
# 生产环境应该设置强密码！
spring.datasource.username=sa
spring.datasource.password=

# ─────────────────────────────────────────────────────────────────────────────
# 四、JPA/Hibernate 配置
# ─────────────────────────────────────────────────────────────────────────────
# DDL 自动生成策略
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ spring.jpa.hibernate.ddl-auto 的可选值：                                 │
# │                                                                          │
# │ - none:     不做任何操作                                                 │
# │ - validate: 验证实体与数据库表结构是否匹配，不匹配则报错                    │
# │ - update:   根据实体更新表结构（保留现有数据）                             │
# │ - create:   每次启动删除并重建表（数据丢失！）                             │
# │ - create-drop: 启动时创建，关闭时删除（仅用于测试）                        │
# │                                                                          │
# │ 开发环境推荐：update（方便开发，保留数据）                                 │
# │ 生产环境推荐：validate 或 none（手动管理数据库结构）                       │
# └─────────────────────────────────────────────────────────────────────────┘
spring.jpa.hibernate.ddl-auto=update

# 是否显示 SQL 语句
# 开发环境建议开启，便于调试和优化 SQL
# 生产环境建议关闭，避免性能损失和日志泄露
spring.jpa.show-sql=true

# 格式化 SQL 输出，便于阅读
spring.jpa.properties.hibernate.format_sql=true

# ─────────────────────────────────────────────────────────────────────────────
# 五、H2 控制台配置
# ─────────────────────────────────────────────────────────────────────────────
# 是否启用 H2 Web 控制台
# 控制台地址：http://localhost:8080/h2-console
# JDBC URL：jdbc:h2:file:./data/electricdb
# 用户名：sa，密码为空
#
# ⚠️ 安全警告：生产环境必须禁用！
# 生产环境配置：spring.h2.console.enabled=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─────────────────────────────────────────────────────────────────────────────
# 六、JWT 配置
# ─────────────────────────────────────────────────────────────────────────────
# JWT 签名密钥
# ⚠️ 安全警告：生产环境应该使用环境变量！
# 配置方式：jwt.secret=${JWT_SECRET:默认密钥}
#
# 密钥要求：
# - 长度至少 256 位（32 字节）用于 HS256 算法
# - 包含大小写字母、数字、特殊字符
# - 不要使用容易猜测的内容
jwt.secret=electric-grid-system-jwt-secret-key-very-long-and-secure-2024

# Token 有效期（毫秒）
# 86400000 = 24小时 = 24 * 60 * 60 * 1000
# 常用值：
# - 3600000: 1小时
# - 7200000: 2小时
# - 86400000: 24小时（1天）
# - 604800000: 7天
jwt.expiration=86400000
